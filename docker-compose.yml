services:

  mysql:
    image: mysql:8.0
    container_name: todo-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todo_db

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql


  backend:
    build:
      context: ./backend/todo
    container_name: todo-backend

    ports:
      - "8080:8080"

    depends_on:
      - mysql


  frontend:
    build:
      context: ./frontend
    container_name: todo-frontend

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  mysql-data: